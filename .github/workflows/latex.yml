
name: Compile LaTeX and Update PDF

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'PDF/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: Updated_Internship_Report.tex
          args: -pdf -file-line-error -interaction=nonstopmode

      - name: Create PDF folder
        run: mkdir -p PDF

      - name: Copy generated PDF
        run: cp Updated_Internship.pdf PDF/Updated_Internship.pdf

      - name: Commit generated PDF
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automatically update compiled LaTeX PDF"
          file_pattern: "PDF/Updated_Internship.pdf"
