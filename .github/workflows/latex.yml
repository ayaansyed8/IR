
name: Compile LaTeX and Update PDF

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'PDF/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@v3
        with:
          root_file: Updated_Intership.tex
          args: -pdf -file-line-error -interaction=nonstopmode

      - name: Create PDF directory
        run: mkdir -p PDF

      - name: Copy compiled PDF
        run: cp Updated_Intership.pdf PDF/Updated_Intership.pdf

      - name: Commit PDF to GitHub
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automatically update compiled PDF"
          file_pattern: "PDF/Updated_Intership.pdf"

